name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libasound2-dev cmake clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Test
        run: cargo test --no-default-features --locked
      - name: Build
        run: cargo build --release --locked
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb --no-build --output dist/
      - name: Package tarball and checksums
        shell: bash
        run: |
          set -euo pipefail
          name="l-gpui-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "$name"
          cp target/release/l-gpui README.md LICENSE packaging/l-gpui.desktop assets/l-gpui.svg assets/l-gpui-256.png "$name/"
          tar czf "dist/$name.tar.gz" "$name"
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: l-gpui-linux
          path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
