name: CI
on:
  push:
    branches: ["**"]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    name: Test (core, no UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo test --no-default-features --locked
  build:
    name: Build Linux (GPUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libasound2-dev cmake clang
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - run: cargo build --release --locked
      - run: cargo test --locked
